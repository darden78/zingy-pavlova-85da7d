<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FANTASTICA - Verifica email</title><meta name="theme-color" content="#000000">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}.box{width:min(520px,100%);background:#202020;border-radius:18px;padding:26px;text-align:center}h1{font-size:34px}.ok{color:#55e28b}.bad{color:#ff6767}.wait{color:#ffc857}</style>
</head><body><div class="box"><h1>⚽ FANTASTICA</h1><h2 id="title">Verifica email...</h2><p id="message" class="wait">Attendi qualche secondo.</p></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from "./config.js?v=fantastica-v31";
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const q=new URLSearchParams(location.search),pending=q.get("pending"),token=q.get("token");
const title=document.getElementById("title"),message=document.getElementById("message");
const show=(t,m,c)=>{title.textContent=t;message.textContent=m;message.className=c};

async function waitForEmailSession(){
 for(let i=0;i<40;i++){
   const {data:{session}}=await db.auth.getSession();
   if(session?.user?.email)return session;
   await new Promise(r=>setTimeout(r,250));
 }
 return null;
}
(async()=>{
 try{
   if(!pending||!token){show("Link non valido","Mancano i dati di verifica.","bad");return}
   const session=await waitForEmailSession();
   if(!session){show("Verifica non completata","Il link email non ha creato una sessione valida. Prova a riaprire il link ricevuto.","bad");return}
   const {data,error}=await db.rpc("fa_verify_pending_league",{p_pending_id:pending,p_verification_token:token});
   if(error||!data?.ok){show("Errore di verifica",error?.message||data?.error||"Errore sconosciuto","bad");return}
   show("✓ Email verificata","Puoi chiudere questa pagina. Sul PC FANTASTICA entrerà automaticamente nella nuova lega.","ok");
 }catch(e){show("Errore di verifica",e.message,"bad")}
})();
</script></body></html>
