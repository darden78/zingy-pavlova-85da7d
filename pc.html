<style>

.wrap{max-width:1900px;margin:auto;padding:14px}.brand{text-align:center;font-size:42px;margin:6vh 0 25px}
#leagueHome{max-width:820px;margin:auto}.authTabs{display:flex;gap:8px;margin-bottom:12px}.authTabs button{flex:1;border:0;border-radius:10px;padding:12px;background:#333;color:#fff;font-weight:900;cursor:pointer}.authTabs button.active{background:#2f8f57}.authForm label{display:block;font-size:12px;color:#aaa;margin-top:9px}.authForm input{width:100%;padding:11px;border:0;border-radius:9px;margin-top:4px}.authAction{width:100%;border:0;border-radius:11px;padding:13px;background:#2f8f57;color:#fff;font-weight:900;margin-top:13px;cursor:pointer}.homeCard,.card{background:#202020;border-radius:16px;padding:18px;margin:14px 0}
.leagueBtn{width:100%;text-align:left;border:0;background:#303030;color:#fff;border-radius:12px;padding:15px;margin:6px 0;font-size:19px;font-weight:800;cursor:pointer}
.createGrid{display:grid;grid-template-columns:2fr repeat(2,1fr);gap:10px}.createGrid label{font-size:12px;color:#aaa}.createGrid input{width:100%;padding:10px;border:0;border-radius:9px}.createFull{grid-column:1/-1}.createBtn{grid-column:1/-1;border:0;border-radius:11px;padding:13px;background:#2f8f57;color:#fff;font-weight:900;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.top h1{margin:0;flex:1}.top button{border:0;border-radius:9px;padding:9px 12px;background:#333;color:#fff;font-weight:800;cursor:pointer}

.center{min-width:0}.hero{background:#202020;border-radius:16px;padding:12px;text-align:center}.currentPlayer{background:#171717;border-radius:12px;padding:10px;margin-bottom:9px;min-height:68px}.currentPlayer .pn{font-size:25px;font-weight:900}.currentPlayer .meta{color:#bbb;font-size:14px}
.amount{font-size:72px;line-height:.95;font-weight:900}.who{font-size:25px}.timer{font-size:38px;font-weight:900;margin-top:5px}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.controls button{border:0;border-radius:10px;padding:9px 13px;color:#fff;font-weight:800;cursor:pointer}.pause{background:#9b6b20}.undo{background:#315f8a}.newAuction{background:#2f8f57}.confirmBuy{background:#8b5fc5}.controls button:disabled{opacity:.35;cursor:default}.eventPos{font-size:12px;color:#999;margin-top:6px}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.p{background:#202020;border-radius:10px;padding:9px;cursor:pointer}.p:hover{outline:1px solid #555}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;background:#e74c3c}.dot.on{background:#49dd82}.ps{font-size:11px;margin-top:4px;color:#aaa}.high{color:#ffd166}.ab{color:#ff7777}.in{color:#55e28b}
table{width:100%;border-collapse:collapse;background:#202020;border-radius:10px;overflow:hidden;font-size:12px}th,td{padding:7px;border-bottom:1px solid #333;text-align:left}
.rosterHead{font-size:14px;color:#bbb;line-height:1.35;margin-bottom:7px}.rosterName{font-size:24px;font-weight:900}.rosterStats{display:grid;grid-template-columns:1fr 1fr;gap:4px 9px;margin:7px 0;font-size:13px}
.roleBlock{margin-top:6px}.roleTitle{font-size:13px;font-weight:900;color:#ddd;border-bottom:1px solid #333;margin-bottom:2px}.rosterRow{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:clamp(11px,1.45vh,15px);line-height:1.35;white-space:nowrap;min-height:18px;align-items:center}.rosterRow span:first-child{overflow:hidden;text-overflow:ellipsis}.emptyLine{color:#555}
.rightTop{display:flex;gap:6px;align-items:center;margin-bottom:6px}.rightTop button{border:0;border-radius:8px;padding:7px 9px;background:#333;color:#fff;font-weight:800;cursor:pointer}.listControls{display:grid;grid-template-columns:1fr auto;gap:5px;margin-bottom:6px}.listControls input,.listControls select{min-width:0;padding:7px;border:0;border-radius:8px;background:#2a2a2a;color:#fff}
.roleFilters{display:flex;gap:4px;margin-bottom:6px}.roleFilters button{flex:1;border:0;border-radius:7px;padding:6px;background:#2c2c2c;color:#fff;font-weight:800;cursor:pointer}.roleFilters button.active{background:#2f8f57}
.playerList{height:calc(100vh - 300px);overflow:auto}.listRow{display:grid;grid-template-columns:1fr 30px 30px;gap:4px;align-items:center;border-bottom:1px solid #292929;padding:5px 2px;cursor:pointer}.listRow:hover{background:#242424}.listName{font-size:12px;font-weight:800}.listMeta{font-size:10px;color:#aaa}.editBtn{border:0;border-radius:6px;background:#444;color:#fff;height:27px;cursor:pointer}.assigned{opacity:.45}.modifiedMark{color:#ffc857}
.importBox{background:#202020;border-radius:10px;padding:8px;margin-bottom:7px}.importBox input[type=file]{width:100%;font-size:11px}.importActions{display:flex;gap:5px;margin-top:5px}.importActions input{min-width:0;flex:1;padding:6px;background:#2b2b2b;color:#fff;border:0;border-radius:7px}.importActions button{border:0;border-radius:7px;background:#315f8a;color:#fff;font-weight:800;padding:6px 8px}

.linkBox{background:#202020;border-radius:12px;padding:10px;margin-top:12px}.linkRow{display:grid;grid-template-columns:90px 1fr 72px;gap:7px;align-items:center;padding:6px 0;border-bottom:1px solid #333}.linkRow code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#bbb;font-size:11px}.copyLink{border:0;border-radius:7px;padding:7px;background:#315f8a;color:#fff;font-weight:800;cursor:pointer}.manageRow{display:grid;grid-template-columns:1fr 80px 70px;gap:5px;align-items:center;padding:6px 0;border-bottom:1px solid #333}.manageRow button{border:0;border-radius:7px;padding:6px;color:#fff}.rename{background:#315f8a}.release{background:#8b3030}
@media(max-width:1250px){.workspace{grid-template-columns:240px 1fr}.rightSide{grid-column:1/-1;position:static;height:70vh}.players{grid-template-columns:repeat(3,1fr)}}

.listRow.roleActive{background:#364b38;border:1px solid #57d67d}.listRow.roleActive .listName{font-weight:900;color:#fff}.listRow.roleInactive{opacity:.38;cursor:not-allowed}.phaseBadge{display:inline-block;padding:5px 10px;border-radius:999px;background:#375b42;font-weight:900;margin-left:8px}
.celebrate{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;text-align:center;overflow:hidden}.celebrate.show{display:flex}.celebrateBox{position:relative;z-index:2}.celebrate h1{font-size:clamp(38px,7vw,90px);margin:0 20px;text-shadow:0 0 25px #fff}.celebrate p{font-size:24px}.firework{position:absolute;width:8px;height:8px;border-radius:50%;box-shadow:0 -70px #ffdf5d,49px -49px #ff5d8f,70px 0 #65e0ff,49px 49px #8cff65,0 70px #ff9b5d,-49px 49px #c865ff,-70px 0 #fff,-49px -49px #5dffca;animation:boom 1.2s infinite ease-out}.fw1{left:25%;top:35%}.fw2{left:72%;top:28%;animation-delay:.35s}.fw3{left:55%;top:70%;animation-delay:.7s}@keyframes boom{0%{transform:scale(.1);opacity:0}25%{opacity:1}100%{transform:scale(2.3);opacity:0}}
.exportActions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}.exportActions button{border:0;border-radius:12px;padding:13px 18px;font-weight:900;font-size:17px;cursor:pointer}

 <div class="brand">⚽ FANTASTICA</div>
 <div class="authTabs"><button id="tabLogin" class="active">ENTRA IN UNA LEGA</button><button id="tabCreate">CREA NUOVA LEGA</button></div>

 <div id="loginCard" class="homeCard authForm">

 </div>

  <label>Conferma password</label><input id="newPassword2" type="password" minlength="5">
  <label>Email di verifica</label><input id="newEmail" type="email">
  <div class="createGrid" style="margin-top:12px">
   <div><label>Partecipanti lega</label><input id="newMembers" type="number" min="6" max="12" value="8"></div>
   <div><label>Partecipanti asta</label><input id="newAuctionCount" type="number" min="2" max="12" value="8"></div>
   <div><label>Timer (s)</label><input id="newDuration" type="number" min="1" max="600" value="10"></div>
   <div><label>Crediti iniziali</label><input id="newCredits" type="number" min="1" value="600"></div>

   <div><label>Difensori</label><input id="newD" type="number" min="0" value="9"></div>
   <div><label>Centrocampisti</label><input id="newC" type="number" min="0" value="9"></div>
   <div><label>Attaccanti</label><input id="newA" type="number" min="0" value="7"></div>
   <div class="roleModeBox">
    <label>Modalità asta</label>
    <select id="newAuctionMode"><option value="FREE">Asta libera</option><option value="ROLE">Asta per ruolo</option></select>
    <div id="newRoleOrderBox" class="hidden" style="margin-top:9px">
     <label>Ordine ruoli</label><div class="roleOrder">
      <select class="newRoleOrd"><option>P</option><option>D</option><option>C</option><option>A</option></select>
      <select class="newRoleOrd"><option>D</option><option>P</option><option>C</option><option>A</option></select>
      <select class="newRoleOrd"><option>C</option><option>P</option><option>D</option><option>A</option></select>
      <select class="newRoleOrd"><option>A</option><option>P</option><option>D</option><option>C</option></select>
     </div>
    </div>

  </div>
  <button id="createLeague" class="authAction">INVIA EMAIL DI VERIFICA</button>

 </div>
</section>

<section id="regia" class="hidden">
 <div class="top"><button id="changeLeague">← ESCI REGIA</button><h1>⚽ <span id="leagueName"></span><span id="phaseBadge" class="phaseBadge hidden"></span></h1><button id="settingsBtn">⚙ IMPOSTAZIONI</button></div>
 <div id="status" class="status">Avvio...</div>
 <div class="workspace">
  <aside class="side"><h2>ROSA MIGLIOR OFFERENTE</h2><div id="leaderRoster"></div></aside>
  <main class="center">
   <div class="hero">
    <div id="currentPlayer" class="currentPlayer"><div class="pn">Seleziona un giocatore dal listone</div></div>
    <div>OFFERTA ATTUALE</div><div id="amount" class="amount">0</div><div id="who" class="who">Nessun offerente</div><div id="timer" class="timer">—</div><div id="closed"></div>
    <div class="controls">
     <button id="prevEvent" class="undo">◀ EVENTO PRECEDENTE</button>
     <button id="pauseTimer" class="pause">⏸ PAUSA TIMER</button>
     <button id="nextEvent" class="undo">EVENTO SUCCESSIVO ▶</button>
     <button id="newAuction" class="newAuction">NUOVA ASTA</button>
    </div><div id="eventPos" class="eventPos"></div>
   </div>
   <div id="players" class="players"></div>
   <h3>ULTIMI RILANCI</h3>
   <table><thead><tr><th>Ora</th><th>Giocatore</th><th>Offerta</th><th>Tipo</th></tr></thead><tbody id="log"></tbody></table>
  </main>
  <aside class="side rightSide">

   <div id="listView">

     <input id="listFile" type="file" accept=".csv,.xlsx,.xls">

    </div>
    <div class="listControls"><input id="searchPlayer" placeholder="Cerca giocatore..."><select id="sortPlayers">
      <option value="value_desc">Quotazione ↓</option><option value="value_asc">Quotazione ↑</option><option value="name_asc">Nome A-Z</option><option value="name_desc">Nome Z-A</option><option value="team">Squadra</option><option value="role">Ruolo</option>
    </select></div>
    <div class="roleFilters"><button class="rf active" data-role="">TUTTI</button><button class="rf" data-role="P">P</button><button class="rf" data-role="D">D</button><button class="rf" data-role="C">C</button><button class="rf" data-role="A">A</button></div>

<div id="settingsPanel" class="settingsPanel"><div class="settingsBox">
 <h2>Impostazioni lega</h2>
 <div class="settingsGrid">
  <div class="full"><label>Nome lega</label><input id="setName"></div>
  <div><label>Partecipanti lega</label><input id="setMembers" type="number" min="6" max="12"></div>
  <div><label>Partecipanti asta</label><input id="setAuctionCount" type="number" min="2" max="12"></div>
  <div><label>Timer (s)</label><input id="setDuration" type="number" min="1" max="600"></div>
  <div><label>Crediti iniziali</label><input id="setCredits" type="number" min="1"></div>
  <div><label>Portieri</label><input id="setP" type="number" min="0"></div>
  <div><label>Difensori</label><input id="setD" type="number" min="0"></div>
  <div><label>Centrocampisti</label><input id="setC" type="number" min="0"></div>
  <div><label>Attaccanti</label><input id="setA" type="number" min="0"></div>
  <div class="full roleModeBox">
   <label>Modalità asta</label><select id="setAuctionMode"><option value="FREE">Asta libera</option><option value="ROLE">Asta per ruolo</option></select>
   <div id="setRoleOrderBox" class="hidden" style="margin-top:9px"><label>Ordine ruoli</label><div class="roleOrder">
    <select class="setRoleOrd"></select><select class="setRoleOrd"></select><select class="setRoleOrd"></select><select class="setRoleOrd"></select>
   </div></div>
  </div>
 </div>
 <div class="settingsActions"><button id="saveSettings" class="saveSettings">SALVA</button><button id="closeSettings" class="closeSettings">CHIUDI</button></div>
 <div id="settingsMsg"></div>

 <div class="settingsActions"><button id="deleteLeague" class="danger">CANCELLA LEGA</button></div>
</div></div>


<div id="celebrate" class="celebrate">
 <div class="firework fw1"></div><div class="firework fw2"></div><div class="firework fw3"></div>
 <div class="celebrateBox"><h1 id="celebrateTitle"></h1><p id="celebrateSub"></p>
 <div id="exportActions" class="exportActions hidden">
  <button id="exportXlsx">ESPORTA EXCEL</button><button id="exportPdf">ESPORTA PDF</button><button id="exportJson">FILE FANTASTICA</button>
 </div></div>
</div>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,PUBLIC_BASE_URL} from "./config.js?v=fantastica-v46";
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id);
let league=null,auction=null,slots=[],bids=[],events=[],catalog=[],channel=null,retry=null,finalizeBusy=false,selectedRosterSlot=null,roleFilter="";
let serverOffset=0,lastDrumSecond=null,lastRolePhase=null,lastKnownRole=null,lastComplete=false,progressBusy=false;
const msg=(el,t,c="")=>{el.className=c;el.textContent=t};
const slotName=n=>slots.find(s=>s.slot===n)?.display_name||`Posto ${n}`;
const currentPlayer=()=>catalog.find(p=>p.id===auction?.current_player_id);
const roleNames={P:"PORTIERI",D:"DIFENSORI",C:"CENTROCAMPISTI",A:"ATTACCANTI"};
const serverNow=()=>Date.now()+serverOffset;
async function syncServerClock(){try{const t0=Date.now();const {data}=await db.rpc("fa_server_time");const t1=Date.now();if(data?.epoch_ms)serverOffset=Number(data.epoch_ms)-((t0+t1)/2)}catch{}}
setInterval(syncServerClock,30000);

function audioCtx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;window.__faAudio=window.__faAudio||new C();return window.__faAudio}
function tone(freq,dur=.12,vol=.12,type="sine",delay=0){const c=audioCtx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur)}catch{}}
function drum(){tone(90,.14,.22,"square");tone(55,.18,.12,"sine")}
function fireworksSound(){[0,.16,.34,.55].forEach((d,i)=>{tone(160+80*i,.22,.12,"sawtooth",d);tone(70,.28,.15,"sine",d+.05)})}
function showCelebration(title,final=false){const el=$("celebrate");$("celebrateTitle").textContent=title;$("celebrateSub").textContent=final?"Le rose sono complete.":"Si passa al ruolo successivo.";$("exportActions").classList.toggle("hidden",!final);el.classList.add("show");fireworksSound();setTimeout(()=>{if(!final)el.classList.remove("show")},5000)}
$("celebrate").onclick=e=>{if(e.target.id==="celebrate"&&!lastComplete)$("celebrate").classList.remove("show")};

function roleOrderValues(cls){return [...document.querySelectorAll(cls)].map(x=>x.value)}
function validRoleOrder(a){return a.length===4&&new Set(a).size===4&&["P","D","C","A"].every(x=>a.includes(x))}
function fillRoleSelects(cls,order){document.querySelectorAll(cls).forEach((s,i)=>{s.innerHTML=["P","D","C","A"].map(r=>`<option ${r===order[i]?"selected":""}>${r}</option>`).join("")})}
function eligibleSlotsFor(role){if(!league||!role)return[];const lim=league["roster_"+role.toLowerCase()];return slots.filter(s=>s.slot<=league.member_limit&&s.display_name).filter(s=>catalog.filter(p=>p.assigned_slot===s.slot&&p.role===role).length<lim)}
async function checkProgress(){
 if(progressBusy||!league)return;progressBusy=true;
 try{
  const {data}=await db.rpc("fa_v4_check_progress",{p_league_id:league.id});
  if(data?.role_changed||data?.final)await load(false);
 }catch{}finally{progressBusy=false}
}


async function ensureAuth(){
 const {data:{session}}=await db.auth.getSession();
 if(session)return session;
 const {data,error}=await db.auth.signInAnonymously();
 if(error)throw error;
 return data.session;
}
function showAuth(which){
 const login=which==="login";
 $("loginCard").classList.toggle("hidden",!login);
 $("createCard").classList.toggle("hidden",login);
 $("tabLogin").classList.toggle("active",login);
 $("tabCreate").classList.toggle("active",!login);
}
$("tabLogin").onclick=()=>showAuth("login");
$("tabCreate").onclick=()=>showAuth("create");
$("newAuctionMode").onchange=()=>$("newRoleOrderBox").classList.toggle("hidden",$("newAuctionMode").value!=="ROLE");
$("setAuctionMode").onchange=()=>$("setRoleOrderBox").classList.toggle("hidden",$("setAuctionMode").value!=="ROLE");

$("loginLeagueBtn").onclick=async()=>{
 try{
  await ensureAuth();msg($("loginMsg"),"Accesso...");
  const {data,error}=await db.rpc("fa_login_organizer",{p_name:$("loginLeague").value.trim(),p_password:$("loginPassword").value});
  if(error||!data?.ok){msg($("loginMsg"),"Nome lega o password non corretti.","bad");return}
  $("loginPassword").value="";await openLeague(data.league_id);
 }catch(e){msg($("loginMsg"),"Errore: "+e.message,"bad")}
};

let verificationPoll=null;

async function pollPendingLeague(){
 const raw=localStorage.getItem("fantastica-pending-league-v31");
 if(!raw)return;
 const pending=JSON.parse(raw);
 clearInterval(verificationPoll);
 const check=async()=>{
   try{
     await ensureAuth();
     const {data,error}=await db.rpc("fa_finalize_pending_league_v4",{
       p_pending_id:pending.pending_id,
       p_client_secret:pending.client_secret
     });
     if(error){msg($("homeMsg"),"Errore verifica: "+error.message,"bad");return}
     if(!data?.ok){
       const em=data?.error==="LEGA_GIA_ESISTENTE"?"Esiste già una lega con lo stesso nome e la stessa password.":data?.error;
       msg($("homeMsg"),"Errore: "+em,"bad");clearInterval(verificationPoll);return
     }
     if(data.complete){
       clearInterval(verificationPoll);
       localStorage.removeItem("fantastica-pending-league-v31");
       msg($("homeMsg"),"✓ Email verificata. Apertura lega...","ok");
       await openLeague(data.league_id);
     }else{

async function load(runProgress=true){

  db.from("fa_bids").select("*").eq("league_id",league.id).order("created_at",{ascending:false}).limit(30),
  db.from("fa_events").select("seq,event_type,created_at").eq("league_id",league.id).order("seq"),

 if(l.error||a.error||s.error||b.error||e.error||p.error){msg($("status"),"Errore lettura database","bad");return}
 const prevPhase=lastRolePhase,prevRole=lastKnownRole,prevComplete=lastComplete;
 league=l.data;auction=a.data;slots=s.data||[];bids=b.data||[];events=e.data||[];catalog=p.data||[];

 const ps=catalog.filter(p=>p.assigned_slot===slot),spent=ps.reduce((a,p)=>a+(p.assigned_price||0),0),remain=league.credits_initial-spent,total=league.roster_p+league.roster_d+league.roster_c+league.roster_a;
 const max=Math.max(0,remain-Math.max(0,total-ps.length-1)*1);

}

 for(const s of slots.filter(s=>s.slot<=league.member_limit&&s.display_name)){const r=rosterInfo(s.slot);h+=`<div class="team"><h2>${s.display_name} — Spesi ${r.spent}, residui ${r.remain}</h2><table><tr><th>Ruolo</th><th>Giocatore</th><th>Squadra</th><th>Prezzo</th></tr>${r.ps.sort((a,b)=>a.role.localeCompare(b.role)).map(p=>`<tr><td>${p.role}</td><td>${p.name}</td><td>${p.team||""}</td><td>${p.assigned_price}</td></tr>`).join("")}</table></div>`}
 h+=`</body></html>`;w.document.write(h);w.document.close();setTimeout(()=>w.print(),300)
}
$("exportXlsx").onclick=e=>{e.stopPropagation();exportXlsx()};$("exportJson").onclick=e=>{e.stopPropagation();exportJson()};$("exportPdf").onclick=e=>{e.stopPropagation();exportPdf()};

function renderManage(){
 $("managePlayers").innerHTML=slots.filter(s=>s.slot<=league.member_limit&&s.display_name).map(s=>`<div class="manageRow"><span>${s.display_name}</span><button class="rename" data-ren="${s.slot}">RINOMINA</button><button class="release" data-rel="${s.slot}">LIBERA</button></div>`).join("")||"Nessun partecipante.";
 document.querySelectorAll("[data-ren]").forEach(b=>b.onclick=async()=>{const s=slots.find(x=>x.slot===+b.dataset.ren),n=prompt("Nuovo nome:",s.display_name);if(n?.trim()){await db.rpc("fa_rename_slot",{p_league_id:league.id,p_slot:s.slot,p_name:n.trim()});await load()}});
 document.querySelectorAll("[data-rel]").forEach(b=>b.onclick=async()=>{if(confirm("Liberare il posto?")){await db.rpc("fa_release_slot",{p_league_id:league.id,p_slot:+b.dataset.rel});await load()}});
}
$("deleteLeague").onclick=async()=>{if(!confirm(`Cancellare definitivamente "${league.name}"?`))return;const pwd=prompt("Inserisci la password della lega per confermare:");if(pwd===null)return;if(!confirm("Ultima conferma: operazione irreversibile."))return;const {data,error}=await db.rpc("fa_delete_league",{p_league_id:league.id,p_password:pwd});if(error||!data?.ok){alert(data?.error==="PASSWORD_ERRATA"?"Password errata.":(error?.message||data?.error));return}$("settingsPanel").classList.remove("show");$("changeLeague").click()};

setInterval(()=>{if(league)load()},5000);
(async()=>{
 try{
  await ensureAuth();
  await syncServerClock();
  showAuth("login");
  if(localStorage.getItem("fantastica-pending-league-v31")){
   showAuth("create");
   pollPendingLeague();
   return;
  }
  const lastLeague=localStorage.getItem("fantastica-organizer-last-league");
  if(lastLeague){
   await openLeague(lastLeague);
  }
 }catch(e){
  localStorage.removeItem("fantastica-organizer-last-league");
  msg($("loginMsg"),"Errore autenticazione: "+e.message,"bad");
 }
})();
</script>
