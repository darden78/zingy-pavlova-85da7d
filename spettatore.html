#leagueHome .authTabs{background:#061b31;border:1px solid #123f67;border-radius:13px;padding:5px;box-shadow:0 16px 44px rgba(0,0,0,.28)}
#leagueHome .authTabs button{background:transparent;border:1px solid transparent;border-radius:9px;color:#a9bed5;padding:13px 14px}
#leagueHome .authTabs button.active{background:#0a3e6e;border-color:#17619a;color:#fff;box-shadow:inset 0 0 0 1px rgba(95,174,232,.08)}
#leagueHome .homeCard{background:linear-gradient(180deg,#082a4b 0%,#06243f 100%);border:1px solid #145282;border-radius:14px;box-shadow:0 18px 48px rgba(0,0,0,.32);padding:22px}
#leagueHome .homeCard h2{margin:0 0 15px;font-size:28px;letter-spacing:.4px}
#leagueHome .authForm label,#leagueHome .createGrid label{color:#aac2d9;font-weight:700}
#leagueHome .authForm input,#leagueHome .createGrid input,#leagueHome .authForm select,#leagueHome .createGrid select{background:#071d34;color:#fff;border:1px solid #174b75;outline:none}
#leagueHome .authForm input:focus,#leagueHome .createGrid input:focus,#leagueHome .authForm select:focus,#leagueHome .createGrid select:focus{border-color:#2b85c9;box-shadow:0 0 0 3px rgba(43,133,201,.14)}
#leagueHome .authAction,#leagueHome .createBtn{background:linear-gradient(180deg,#1fa85a,#168447);border:1px solid #38bb70;box-shadow:0 8px 18px rgba(0,0,0,.18)}
#leagueHome .roleModeBox{background:#061d35;border:1px solid #12456f;border-radius:10px;padding:11px}

.settingsPanel{background:rgba(1,10,20,.84);backdrop-filter:blur(6px)}
.settingsBox{width:min(650px,94vw);background:linear-gradient(180deg,#082f54 0%,#06233f 100%);border:1px solid #175b91;border-radius:16px;padding:20px;box-shadow:0 26px 80px rgba(0,0,0,.52)}
.settingsBox>h2{margin:0 0 16px;font-size:29px}.settingsBox>h3{margin:22px 0 8px;padding-top:13px;border-top:1px solid rgba(89,145,191,.28)}
.settingsGrid label{color:#aec6dc;font-weight:700}.settingsGrid input,.settingsGrid select{background:#071d34;color:#fff;border:1px solid #174d78;outline:none}.settingsGrid input:focus,.settingsGrid select:focus{border-color:#2b85c9;box-shadow:0 0 0 3px rgba(43,133,201,.14)}
.settingsActions button{border:1px solid rgba(255,255,255,.08);cursor:pointer}.saveSettings{background:#188c4d;color:#fff}.closeSettings{background:#164d78;color:#fff}.danger{background:#9a3434!important}
.linkBox,.installInvite,.repairInvite{background:#071e36!important;border:1px solid #164b75!important;border-radius:12px!important}.installInvite p,.repairInvite p{color:#aec2d4!important}.copyLink,.installInvite button{background:#1266a6!important}.repairBtn{background:#a87916!important}
.manageRow,.excludedRow{border-bottom:1px solid rgba(92,142,183,.25)}.manageMeta{color:#a9bed5}.rename{background:#14649f}.deviceAction{background:#8d6f22}.manualAction{background:#a87916}.manualAction.on{background:#218b52}.excludedBox{border-top-color:#315c7d}.excludedBox h4{color:#ffcc55}

.rosterModal{background:rgba(1,10,20,.86);backdrop-filter:blur(6px)}
.rosterModalBox{background:linear-gradient(180deg,#082f54 0%,#06233f 100%);border:1px solid #175b91;border-radius:16px;box-shadow:0 26px 80px rgba(0,0,0,.58);color:#fff}
.rosterModalBox h2{color:#fff}.rosterModalBox p{color:#b6cadc}.rosterModalClose{background:#0c426d;border:1px solid #1a5c8f}.rosterModalClose:hover{background:#155b91}
.rosterModalActions button,.rosterChoice{background:#1465a2;border:1px solid #2478b8}.rosterModalActions .dangerAction{background:#9a3434;border-color:#bb4e4e}.rosterModalActions .swapAction{background:#7752b8;border-color:#946ed0}.rosterModalActions .neutralAction{background:#164d78;border-color:#28658e}.rosterChoice{background:#0b3a63}.rosterChoice:hover{background:#104a7d}.refundInput,.repairField input,.repairField select{background:#071d34!important;color:#fff!important;border:1px solid #174d78!important}.repairSummary{background:#071e36;border:1px solid #164b75}.selectionHint{background:#5a4513;color:#ffda74;border:1px solid #866820}.outListWarning{background:#552323;border:1px solid #9c4545}.memberPick{background:#071e36;border-bottom-color:#174b75}



/* Mirror FANTASTICA: stessa grafica PC, sola visione. */
#mirrorView{pointer-events:none;user-select:none;-webkit-user-select:none}
#mirrorView a,#mirrorView button,#mirrorView input,#mirrorView select{pointer-events:none!important}
.viewerBadge{position:fixed;right:12px;bottom:12px;z-index:3000;background:#063b39;border:1px solid #25d366;color:#fff;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900;box-shadow:0 4px 18px #0009}
.viewerBadge.wait{background:#4a3910;border-color:#ffc857}.viewerBadge.bad{background:#572828;border-color:#ff6767}
.viewerWaiting{position:fixed;inset:0;z-index:2500;background:radial-gradient(circle at 50% 20%,#0a3156 0,#031a33 48%,#020b16 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.viewerWaiting.hidden{display:none!important}.viewerWaiting h1{font-size:34px;margin-bottom:10px}.viewerWaiting p{color:#a9bed5}
#mirrorView #regia .headerSettings,#mirrorView #regia .headerExit{opacity:.72}

/* FANTASTICA MIRROR FIT 2026-08-17 — elimina micro-scroll pagina */
html,body{height:100%;max-height:100%;overflow:hidden!important}
body{overscroll-behavior:none}
#mirrorView{height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;overflow:hidden!important}
#mirrorView>.wrap{height:100%;max-height:100%;overflow:hidden!important;padding-top:8px!important;padding-bottom:8px!important}
</style></head><body>
<div id="liveBadge" class="viewerBadge wait">SOLA VISIONE · COLLEGAMENTO…</div>
<div id="mirrorWaiting" class="viewerWaiting"><div><h1>⚽ FANTASTICA</h1><p id="waitingText">Collegamento a FANTASTICA in tempo reale…</p></div></div>
<div id="mirrorView"><div class="wrap">
<section id="regia">
 <header id="mirrorTop" class="regiaHeader">
  <div class="regiaHeaderMain"><div class="appIdentity"><span class="appMark">⚽</span><span class="appTitle">FANTASTICA</span></div><div class="headerDivider"></div><h1 class="leagueTitle">In attesa…</h1></div>
  <div class="regiaHeaderSub"><div id="status" class="status">In attesa di FANTASTICA…</div></div>
 </header>
 <div id="offlineGuard" class="offlineGuard"></div>
 <div class="workspace">
  <aside class="side leftSide"><h2>🏆 MIGLIOR OFFERTA ATTUALE</h2><div id="leaderRoster"></div></aside>
  <main class="center">
   <div class="hero">
    <div class="heroMain">
     <div class="offerZone">
      <div id="currentPlayer" class="currentPlayer"><div class="pn">In attesa…</div></div>
      <div class="offerPanel"><div class="offerLabel">OFFERTA ATTUALE</div><div id="amount" class="amount">—</div><div class="offerBy">DI</div><div id="who" class="who">—</div></div>
     </div>
     <div class="timerPanel"><div class="timerTitle">TIMER</div><div id="timer" class="timer">—</div><div id="timerModeBadge" class="timerModeBadge">TIMER: MANUALE</div></div>
    </div>
    <div id="closed"></div><div id="mirrorControls" class="controls"></div><div id="eventPos" class="eventPos"></div>
   </div>
   <div id="players" class="players"></div>
   <section class="logCard"><h3>ULTIMI RILANCI</h3><table><thead><tr><th>Ora</th><th>Giocatore</th><th>Offerta</th><th>Tipo</th></tr></thead><tbody id="log"></tbody></table></section>
  </main>
  <aside id="mirrorRight" class="side rightSide"></aside>
 </div>
</section></div></div>
<div id="mirrorCelebrate" class="celebrate"></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from "./config.js?v=fantastica-v513-mirror";
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id);
const ua=navigator.userAgent||"";
const isMobileDevice=/Android|iPhone|iPad|iPod|IEMobile|Opera Mini/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const leagueId=new URLSearchParams(location.search).get("lega")||"";
let channel=null,retry=null,requestTimer=null,waitingFresh=true;
const chunkTransfers=new Map();
function setBadge(text,kind=""){const b=$("liveBadge");b.textContent=text;b.className="viewerBadge"+(kind?" "+kind:"")}
function lockInteractions(){document.querySelectorAll("#mirrorView a,#mirrorView button,#mirrorView input,#mirrorView select").forEach(el=>el.tabIndex=-1)}
function applyView(d){
 if(!d||d.league_id!==leagueId)return;
 const p=d.parts||{};
 if(Object.prototype.hasOwnProperty.call(p,"top"))$("mirrorTop").innerHTML=p.top;
 if(Object.prototype.hasOwnProperty.call(p,"status")){$("status").innerHTML=p.status?.html||"";$("status").className=p.status?.className||"status"}
 if(Object.prototype.hasOwnProperty.call(p,"leaderRoster"))$("leaderRoster").innerHTML=p.leaderRoster;
 if(Object.prototype.hasOwnProperty.call(p,"currentPlayer"))$("currentPlayer").innerHTML=p.currentPlayer;
 if(Object.prototype.hasOwnProperty.call(p,"amount"))$("amount").textContent=p.amount;
 if(Object.prototype.hasOwnProperty.call(p,"who"))$("who").textContent=p.who;
 if(Object.prototype.hasOwnProperty.call(p,"timer"))$("timer").textContent=p.timer;
 if(Object.prototype.hasOwnProperty.call(p,"timerModeBadge")){const b=$("timerModeBadge");if(b){b.textContent=p.timerModeBadge?.text||"";b.className=p.timerModeBadge?.className||"timerModeBadge"}}
 if(Object.prototype.hasOwnProperty.call(p,"offlineGuard")){const g=$("offlineGuard");if(g){g.innerHTML=p.offlineGuard?.html||"";g.className=p.offlineGuard?.className||"offlineGuard"}}
 if(Object.prototype.hasOwnProperty.call(p,"closed"))$("closed").textContent=p.closed;
 if(Object.prototype.hasOwnProperty.call(p,"controls"))$("mirrorControls").innerHTML=p.controls;
 if(Object.prototype.hasOwnProperty.call(p,"eventPos"))$("eventPos").textContent=p.eventPos;
 if(Object.prototype.hasOwnProperty.call(p,"players"))$("players").innerHTML=p.players;
 if(Object.prototype.hasOwnProperty.call(p,"log"))$("log").innerHTML=p.log;
 if(Object.prototype.hasOwnProperty.call(p,"rightSide"))$("mirrorRight").innerHTML=p.rightSide;
 if(Object.prototype.hasOwnProperty.call(p,"celebrate")){$("mirrorCelebrate").innerHTML=p.celebrate?.html||"";$("mirrorCelebrate").className=p.celebrate?.className||"celebrate"}
 waitingFresh=false;clearInterval(requestTimer);requestTimer=null;
 $("mirrorWaiting").classList.add("hidden");setBadge("SOLA VISIONE · LIVE");lockInteractions();
}
function applyTimer(d){if(!d||d.league_id!==leagueId)return;$("timer").textContent=d.text??"—";setBadge("SOLA VISIONE · LIVE")}
function applyChunk(d){
 if(!d||d.league_id!==leagueId||!d.transfer_id||!d.key)return;
 let t=chunkTransfers.get(d.transfer_id);
 if(!t){t={key:d.key,total:Number(d.total)||0,chunks:[]};chunkTransfers.set(d.transfer_id,t)}
 t.chunks[Number(d.index)||0]=String(d.chunk||"");
 if(t.total>0&&t.chunks.filter(x=>x!==undefined).length>=t.total){
  const value=t.chunks.slice(0,t.total).join("");chunkTransfers.delete(d.transfer_id);
  applyView({league_id:leagueId,parts:{[t.key]:value}});
 }
}
async function requestView(){if(!channel)return;try{await channel.send({type:"broadcast",event:"MIRROR_REQUEST",payload:{league_id:leagueId,sent_at_ms:Date.now()}})}catch{}}
function startRequests(){clearInterval(requestTimer);waitingFresh=true;requestView();requestTimer=setInterval(()=>{if(waitingFresh)requestView();else{clearInterval(requestTimer);requestTimer=null}},800)}
function disconnect(){clearTimeout(retry);clearInterval(requestTimer);retry=null;requestTimer=null;if(channel)db.removeChannel(channel);channel=null}
async function ensureAuth(){const {data:{session}}=await db.auth.getSession();if(session)return;await db.auth.signInAnonymously()}
async function connect(){
 disconnect();
 if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(leagueId)){$("waitingText").textContent="Link spettatore non valido.";setBadge("SOLA VISIONE · LINK NON VALIDO","bad");return}
 try{await ensureAuth()}catch{}
 channel=db.channel("fantastica-mirror:"+leagueId)
  .on("broadcast",{event:"MIRROR_VIEW"},x=>applyView(x?.payload||x))
  .on("broadcast",{event:"MIRROR_TIMER"},x=>applyTimer(x?.payload||x))
  .on("broadcast",{event:"MIRROR_PART_CHUNK"},x=>applyChunk(x?.payload||x))
  .subscribe(st=>{
   if(st==="SUBSCRIBED"){setBadge("SOLA VISIONE · ATTESA FANTASTICA","wait");startRequests()}
   else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(st)){setBadge("SOLA VISIONE · RICONNESSIONE","bad");clearTimeout(retry);retry=setTimeout(connect,700)}
  });
}
document.addEventListener("click",e=>e.preventDefault(),true);document.addEventListener("submit",e=>e.preventDefault(),true);document.addEventListener("keydown",e=>{if(["Enter"," "].includes(e.key))e.preventDefault()},true);
if(isMobileDevice){
 $("mirrorView").classList.add("hidden");
 $("waitingText").textContent="Il Mirror FANTASTICA è disponibile solo da PC.";
 setBadge("SOLA VISIONE · SOLO PC","bad");
}else connect();
</script></body></html>
