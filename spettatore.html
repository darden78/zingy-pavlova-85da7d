<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FANTASTICA - Spettatore</title>
<meta name="theme-color" content="#101010"><link rel="icon" href="./icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#0e0e0e;color:#fff;font-family:Arial,sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.ok{color:#55e28b}.warn{color:#ffc857}.bad{color:#ff6767}
.wrap{max-width:1900px;margin:auto;padding:14px}.brand{text-align:center;font-size:42px;margin:6vh 0 25px}
#leagueHome{max-width:820px;margin:auto}.authTabs{display:flex;gap:8px;margin-bottom:12px}.authTabs button{flex:1;border:0;border-radius:10px;padding:12px;background:#333;color:#fff;font-weight:900;cursor:pointer}.authTabs button.active{background:#2f8f57}.authForm label{display:block;font-size:12px;color:#aaa;margin-top:9px}.authForm input{width:100%;padding:11px;border:0;border-radius:9px;margin-top:4px}.authAction{width:100%;border:0;border-radius:11px;padding:13px;background:#2f8f57;color:#fff;font-weight:900;margin-top:13px;cursor:pointer}.homeCard,.card{background:#202020;border-radius:16px;padding:18px;margin:14px 0}
.leagueBtn{width:100%;text-align:left;border:0;background:#303030;color:#fff;border-radius:12px;padding:15px;margin:6px 0;font-size:19px;font-weight:800;cursor:pointer}
.createGrid{display:grid;grid-template-columns:2fr repeat(2,1fr);gap:10px}.createGrid label{font-size:12px;color:#aaa}.createGrid input{width:100%;padding:10px;border:0;border-radius:9px}.createFull{grid-column:1/-1}.createBtn{grid-column:1/-1;border:0;border-radius:11px;padding:13px;background:#2f8f57;color:#fff;font-weight:900;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.top h1{margin:0;flex:1}.top button{border:0;border-radius:9px;padding:9px 12px;background:#333;color:#fff;font-weight:800;cursor:pointer}
.status{background:#202020;padding:9px 12px;border-radius:9px;margin-bottom:10px}
.workspace{display:grid;grid-template-columns:minmax(245px,.85fr) minmax(630px,2.2fr) minmax(310px,1.05fr);gap:12px;align-items:start}
.side{height:calc(100vh - 90px);background:#181818;border-radius:14px;padding:10px;overflow:hidden;position:sticky;top:8px}.side h2{font-size:17px;margin:3px 0 7px}
.center{min-width:0}.hero{background:#202020;border-radius:16px;padding:12px;text-align:center}.currentPlayer{background:#171717;border-radius:12px;padding:10px;margin-bottom:9px;min-height:68px}.currentPlayer .pn{font-size:25px;font-weight:900}.currentPlayer .meta{color:#bbb;font-size:14px}
.amount{font-size:72px;line-height:.95;font-weight:900}.who{font-size:25px}.timer{font-size:38px;font-weight:900;margin-top:5px}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.controls button{border:0;border-radius:10px;padding:9px 13px;color:#fff;font-weight:800;cursor:pointer}.pause{background:#9b6b20}.undo{background:#315f8a}.newAuction{background:#2f8f57}.confirmBuy{background:#8b5fc5}.controls button:disabled{opacity:.35;cursor:default}.eventPos{font-size:12px;color:#999;margin-top:6px}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.p{background:#202020;border-radius:10px;padding:9px;cursor:pointer}.p:hover{outline:1px solid #555}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;background:#e74c3c}.dot.on{background:#49dd82}.ps{font-size:11px;margin-top:4px;color:#aaa}.high{color:#ffd166}.ab{color:#ff7777}.in{color:#55e28b}
table{width:100%;border-collapse:collapse;background:#202020;border-radius:10px;overflow:hidden;font-size:12px}th,td{padding:7px;border-bottom:1px solid #333;text-align:left}
.rosterHead{font-size:14px;color:#bbb;line-height:1.35;margin-bottom:7px}.rosterName{font-size:24px;font-weight:900}.rosterStats{display:grid;grid-template-columns:1fr 1fr;gap:4px 9px;margin:7px 0;font-size:13px}
.roleBlock{margin-top:6px}.roleTitle{font-size:13px;font-weight:900;color:#ddd;border-bottom:1px solid #333;margin-bottom:2px}.rosterRow{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:clamp(11px,1.45vh,15px);line-height:1.35;white-space:nowrap;min-height:18px;align-items:center}.rosterRow span:first-child{overflow:hidden;text-overflow:ellipsis}.emptyLine{color:#555}
.rightTop{display:flex;gap:6px;align-items:center;margin-bottom:6px}.rightTop button{border:0;border-radius:8px;padding:7px 9px;background:#333;color:#fff;font-weight:800;cursor:pointer}.listControls{display:grid;grid-template-columns:1fr auto;gap:5px;margin-bottom:6px}.listControls input,.listControls select{min-width:0;padding:7px;border:0;border-radius:8px;background:#2a2a2a;color:#fff}
.roleFilters{display:flex;gap:4px;margin-bottom:6px}.roleFilters button{flex:1;border:0;border-radius:7px;padding:6px;background:#2c2c2c;color:#fff;font-weight:800;cursor:pointer}.roleFilters button.active{background:#2f8f57}
.playerList{height:calc(100vh - 300px);overflow:auto}.listRow{display:grid;grid-template-columns:1fr 30px 30px;gap:4px;align-items:center;border-bottom:1px solid #292929;padding:5px 2px;cursor:pointer}.listRow:hover{background:#242424}.listName{font-size:12px;font-weight:800}.listMeta{font-size:10px;color:#aaa}.editBtn{border:0;border-radius:6px;background:#444;color:#fff;height:27px;cursor:pointer}.assigned{opacity:.45}.modifiedMark{color:#ffc857}
.importBox{background:#202020;border-radius:10px;padding:8px;margin-bottom:7px}.importBox input[type=file]{width:100%;font-size:11px}.importActions{display:flex;gap:5px;margin-top:5px}.importActions input{min-width:0;flex:1;padding:6px;background:#2b2b2b;color:#fff;border:0;border-radius:7px}.importActions button{border:0;border-radius:7px;background:#315f8a;color:#fff;font-weight:800;padding:6px 8px}
.settingsPanel{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:50}.settingsPanel.show{display:flex}.settingsBox{width:min(590px,94vw);max-height:92vh;overflow:auto;background:#202020;border-radius:15px;padding:18px}.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.settingsGrid label{font-size:12px;color:#bbb}.settingsGrid input{width:100%;padding:9px;border:0;border-radius:8px}.full{grid-column:1/-1}.settingsActions{display:flex;gap:8px;margin-top:12px}.settingsActions button{flex:1;padding:11px;border:0;border-radius:9px;font-weight:900}.saveSettings{background:#2f8f57;color:#fff}.closeSettings{background:#444;color:#fff}.danger{background:#8b3030!important;color:#fff}
.linkBox{background:#202020;border-radius:12px;padding:10px;margin-top:12px}.linkRow{display:grid;grid-template-columns:90px 1fr 72px;gap:7px;align-items:center;padding:6px 0;border-bottom:1px solid #333}.linkRow code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#bbb;font-size:11px}.copyLink{border:0;border-radius:7px;padding:7px;background:#315f8a;color:#fff;font-weight:800;cursor:pointer}.manageRow{display:grid;grid-template-columns:1fr 80px 70px;gap:5px;align-items:center;padding:6px 0;border-bottom:1px solid #333}.manageRow button{border:0;border-radius:7px;padding:6px;color:#fff}.rename{background:#315f8a}.release{background:#8b3030}
@media(max-width:1250px){.workspace{grid-template-columns:240px 1fr}.rightSide{grid-column:1/-1;position:static;height:70vh}.players{grid-template-columns:repeat(3,1fr)}}

.roleModeBox{grid-column:1/-1;background:#171717;border-radius:10px;padding:10px;margin-top:4px}
.roleOrder{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.roleOrder select{min-width:65px;padding:8px;border:0;border-radius:8px}
.listRow.roleActive{background:#364b38;border:1px solid #57d67d}.listRow.roleActive .listName{font-weight:900;color:#fff}.listRow.roleInactive{opacity:.38;cursor:not-allowed}.phaseBadge{display:inline-block;padding:5px 10px;border-radius:999px;background:#375b42;font-weight:900;margin-left:8px}
.celebrate{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;text-align:center;overflow:hidden}.celebrate.show{display:flex}.celebrateBox{position:relative;z-index:2}.celebrate h1{font-size:clamp(38px,7vw,90px);margin:0 20px;text-shadow:0 0 25px #fff}.celebrate p{font-size:24px}.firework{position:absolute;width:8px;height:8px;border-radius:50%;box-shadow:0 -70px #ffdf5d,49px -49px #ff5d8f,70px 0 #65e0ff,49px 49px #8cff65,0 70px #ff9b5d,-49px 49px #c865ff,-70px 0 #fff,-49px -49px #5dffca;animation:boom 1.2s infinite ease-out}.fw1{left:25%;top:35%}.fw2{left:72%;top:28%;animation-delay:.35s}.fw3{left:55%;top:70%;animation-delay:.7s}@keyframes boom{0%{transform:scale(.1);opacity:0}25%{opacity:1}100%{transform:scale(2.3);opacity:0}}
.exportActions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}.exportActions button{border:0;border-radius:12px;padding:13px 18px;font-weight:900;font-size:17px;cursor:pointer}

.installInvite{margin-top:18px;background:#171717;border-radius:12px;padding:14px;text-align:center}.installInvite img{width:210px;height:210px;background:#fff;padding:8px;border-radius:12px}.installInvite p{color:#bbb;font-size:12px;margin:8px 0}.installInvite a{display:inline-block;margin-top:8px;color:#fff;background:#315f8a;text-decoration:none;border-radius:8px;padding:9px 12px;font-weight:900}.installInvite button{display:inline-block;margin:8px 0 0 7px;border:0;color:#fff;background:#315f8a;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}

/* Solo pagina spettatore */
#mirrorView{pointer-events:none;user-select:none;-webkit-user-select:none}
#mirrorView a,#mirrorView button,#mirrorView input,#mirrorView select{pointer-events:none!important}
.viewerBadge{position:fixed;right:12px;top:10px;z-index:3000;background:#244f36;border:1px solid #55e28b;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;box-shadow:0 2px 12px #0008}
.viewerBadge.wait{background:#4e4421;border-color:#ffc857}.viewerBadge.bad{background:#572828;border-color:#ff6767}
.viewerWaiting{position:fixed;inset:0;z-index:2500;background:#0e0e0e;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.viewerWaiting.hidden{display:none!important}.viewerWaiting h1{font-size:32px;margin-bottom:10px}.viewerWaiting p{color:#aaa}
</style></head><body>
<div id="liveBadge" class="viewerBadge wait">SOLA VISIONE · COLLEGAMENTO…</div>
<div id="mirrorWaiting" class="viewerWaiting"><div><h1>⚽ FANTASTICA</h1><p id="waitingText">Collegamento alla Regia in tempo reale…</p></div></div>
<div id="mirrorView">
 <div class="wrap">
  <section id="regia">
   <div id="mirrorTop" class="top"><h1>⚽ FANTASTICA</h1></div>
   <div id="status" class="status">In attesa della Regia…</div>
   <div class="workspace">
    <aside class="side"><h2>ROSA MIGLIOR OFFERENTE</h2><div id="leaderRoster"></div></aside>
    <main class="center">
     <div class="hero">
      <div id="currentPlayer" class="currentPlayer"><div class="pn">In attesa…</div></div>
      <div>OFFERTA ATTUALE</div><div id="amount" class="amount">—</div><div id="who" class="who">—</div><div id="timer" class="timer">—</div><div id="closed"></div>
      <div id="mirrorControls" class="controls"></div><div id="eventPos" class="eventPos"></div>
     </div>
     <div id="players" class="players"></div>
     <h3>ULTIMI RILANCI</h3>
     <table><thead><tr><th>Ora</th><th>Giocatore</th><th>Offerta</th><th>Tipo</th></tr></thead><tbody id="log"></tbody></table>
    </main>
    <aside id="mirrorRight" class="side rightSide"></aside>
   </div>
  </section>
 </div>
</div>
<div id="mirrorCelebrate" class="celebrate"></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from "./config.js?v=fantastica-v505-mirror";
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id);
let leagueId=new URLSearchParams(location.search).get("lega")||"";
let pendingMirrorId=new URLSearchParams(location.search).get("pending")||"";
let channel=null,retry=null,requestTimer=null,waitingFresh=true;
const chunkTransfers=new Map();
function validUuid(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v||"")}
function extractPendingFromEmailLink(){
 if(pendingMirrorId)return pendingMirrorId;
 let raw=(location.hash||"").slice(1);
 if(!raw)return "";
 for(let i=0;i<2;i++){try{const d=decodeURIComponent(raw);if(d===raw)break;raw=d}catch{break}}
 try{
  const u=new URL(raw,location.href),p=u.searchParams.get("pending")||"";
  if(validUuid(p)){
   pendingMirrorId=p;
   // Elimina immediatamente dal browser qualunque altro dato presente nel redirect della mail.
   history.replaceState(null,"",location.pathname+"?pending="+encodeURIComponent(p));
   return p;
  }
 }catch{}
 return "";
}
async function resolveEmailMirror(){
 const pending=extractPendingFromEmailLink();
 if(!pending)return false;
 $("waitingText").textContent="Preparazione del Mirror della lega…";setBadge("SOLA VISIONE · ATTESA LEGA","wait");
 for(let i=0;i<120;i++){
  try{
   const {data,error}=await db.rpc("fa_mirror_resolve_pending",{p_pending_id:pending});
   if(!error&&data?.ok&&data?.ready&&validUuid(data.league_id)){
    location.replace(location.pathname+"?lega="+encodeURIComponent(data.league_id));
    return true;
   }
   if(!error&&data&&!data.ok){$("waitingText").textContent="Link Mirror non valido o non più disponibile.";setBadge("SOLA VISIONE · LINK NON VALIDO","bad");return true}
  }catch{}
  await new Promise(r=>setTimeout(r,1500));
 }
 $("waitingText").textContent="La lega non è ancora pronta. Verifica prima l’email e poi riapri questo link.";setBadge("SOLA VISIONE · LEGA NON ANCORA PRONTA","wait");
 return true;
}
function setBadge(text,kind=""){const b=$("liveBadge");b.textContent=text;b.className="viewerBadge"+(kind?" "+kind:"")}
function lockInteractions(){document.querySelectorAll("#mirrorView a,#mirrorView button,#mirrorView input,#mirrorView select").forEach(el=>el.tabIndex=-1)}
function applyView(d){
 if(!d||d.league_id!==leagueId)return;
 const p=d.parts||{};
 if(Object.prototype.hasOwnProperty.call(p,"top"))$("mirrorTop").innerHTML=p.top;
 if(Object.prototype.hasOwnProperty.call(p,"status")){$("status").innerHTML=p.status?.html||"";$("status").className=p.status?.className||"status"}
 if(Object.prototype.hasOwnProperty.call(p,"leaderRoster"))$("leaderRoster").innerHTML=p.leaderRoster;
 if(Object.prototype.hasOwnProperty.call(p,"currentPlayer"))$("currentPlayer").innerHTML=p.currentPlayer;
 if(Object.prototype.hasOwnProperty.call(p,"amount"))$("amount").textContent=p.amount;
 if(Object.prototype.hasOwnProperty.call(p,"who"))$("who").textContent=p.who;
 if(Object.prototype.hasOwnProperty.call(p,"timer"))$("timer").textContent=p.timer;
 if(Object.prototype.hasOwnProperty.call(p,"closed"))$("closed").textContent=p.closed;
 if(Object.prototype.hasOwnProperty.call(p,"controls"))$("mirrorControls").innerHTML=p.controls;
 if(Object.prototype.hasOwnProperty.call(p,"eventPos"))$("eventPos").textContent=p.eventPos;
 if(Object.prototype.hasOwnProperty.call(p,"players"))$("players").innerHTML=p.players;
 if(Object.prototype.hasOwnProperty.call(p,"log"))$("log").innerHTML=p.log;
 if(Object.prototype.hasOwnProperty.call(p,"rightSide"))$("mirrorRight").innerHTML=p.rightSide;
 if(Object.prototype.hasOwnProperty.call(p,"celebrate")){$("mirrorCelebrate").innerHTML=p.celebrate?.html||"";$("mirrorCelebrate").className=p.celebrate?.className||"celebrate"}
 waitingFresh=false;clearInterval(requestTimer);requestTimer=null;
 $("mirrorWaiting").classList.add("hidden");setBadge("SOLA VISIONE · LIVE");lockInteractions();
}
function applyTimer(d){if(!d||d.league_id!==leagueId)return;$("timer").textContent=d.text??"—";setBadge("SOLA VISIONE · LIVE")}
function applyChunk(d){
 if(!d||d.league_id!==leagueId||!d.transfer_id||!d.key)return;
 let t=chunkTransfers.get(d.transfer_id);
 if(!t){t={key:d.key,total:Number(d.total)||0,chunks:[]};chunkTransfers.set(d.transfer_id,t)}
 t.chunks[Number(d.index)||0]=String(d.chunk||"");
 if(t.total>0&&t.chunks.filter(x=>x!==undefined).length>=t.total){
  const value=t.chunks.slice(0,t.total).join("");chunkTransfers.delete(d.transfer_id);
  applyView({league_id:leagueId,parts:{[t.key]:value}});
 }
}
async function requestView(){if(!channel)return;try{await channel.send({type:"broadcast",event:"MIRROR_REQUEST",payload:{league_id:leagueId,sent_at_ms:Date.now()}})}catch{}}
function startRequests(){clearInterval(requestTimer);waitingFresh=true;requestView();requestTimer=setInterval(()=>{if(waitingFresh)requestView();else{clearInterval(requestTimer);requestTimer=null}},800)}
function disconnect(){clearTimeout(retry);clearInterval(requestTimer);retry=null;requestTimer=null;if(channel)db.removeChannel(channel);channel=null}
async function ensureAuth(){const {data:{session}}=await db.auth.getSession();if(session)return;await db.auth.signInAnonymously()}
async function connect(){
 disconnect();
 if(!validUuid(leagueId)){$("waitingText").textContent="Link spettatore non valido.";setBadge("SOLA VISIONE · LINK NON VALIDO","bad");return}
 try{await ensureAuth()}catch{}
 channel=db.channel("fantastica-mirror:"+leagueId)
  .on("broadcast",{event:"MIRROR_VIEW"},x=>applyView(x?.payload||x))
  .on("broadcast",{event:"MIRROR_TIMER"},x=>applyTimer(x?.payload||x))
  .on("broadcast",{event:"MIRROR_PART_CHUNK"},x=>applyChunk(x?.payload||x))
  .subscribe(st=>{
   if(st==="SUBSCRIBED"){setBadge("SOLA VISIONE · ATTESA REGIA","wait");startRequests()}
   else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(st)){setBadge("SOLA VISIONE · RICONNESSIONE","bad");clearTimeout(retry);retry=setTimeout(connect,700)}
  });
}
document.addEventListener("click",e=>e.preventDefault(),true);document.addEventListener("submit",e=>e.preventDefault(),true);document.addEventListener("keydown",e=>{if(["Enter"," "].includes(e.key))e.preventDefault()},true);
(async()=>{
 if(!leagueId){const handled=await resolveEmailMirror();if(handled)return}
 connect();
})();
</script></body></html>
